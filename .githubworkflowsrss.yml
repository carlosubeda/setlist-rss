name: Actualizar RSS de conciertos
on:
  schedule:
    - cron: '17 6 * * *' # Diario, 06:17 UTC (07:17/08:17 en Madrid)
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generar RSS desde el HTML de setlist.fm
        env:
          SETLIST_USER: carlosubeda
          FEED_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 build_feed.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
